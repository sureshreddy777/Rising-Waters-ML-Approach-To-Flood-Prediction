<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floods Prediction | AI System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-water text-primary"></i>
                Floods Prediction
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="fas fa-home me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/intro"><i class="fas fa-info-circle me-1"></i> Introduction</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/image"><i class="fas fa-images me-1"></i> Images</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/imageprediction"><i class="fas fa-camera me-1"></i> Image
                            Prediction</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow-lg border-0">
                    <div class="card-header">
                        <h3><i class="fas fa-chart-line me-2"></i>Flood Prediction Model</h3>
                        <p class="text-white-50 mb-0">Enter environmental data to assess flood risk</p>
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label for="cloudCover" class="form-label"><i class="fas fa-cloud me-2"></i>Cloud
                                        Cover (%)</label>
                                    <input type="number" class="form-control" id="cloudCover" name="cloud_cover"
                                        placeholder="0-100" min="0" max="100" step="0.01" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="annualRainfall" class="form-label"><i
                                            class="fas fa-cloud-showers-heavy me-2"></i>Annual Rainfall (mm)</label>
                                    <input type="number" class="form-control" id="annualRainfall" name="annual_rainfall"
                                        placeholder="e.g. 1200" min="0" step="0.01" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="janFebRainfall" class="form-label"><i
                                            class="fas fa-calendar-alt me-2"></i>Jan-Feb Rainfall (mm)</label>
                                    <input type="number" class="form-control" id="janFebRainfall"
                                        name="jan_feb_rainfall" placeholder="Enter amount" min="0" step="0.01" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="marchMayRainfall" class="form-label"><i
                                            class="fas fa-sun me-2"></i>March-May Rainfall (mm)</label>
                                    <input type="number" class="form-control" id="marchMayRainfall"
                                        name="march_may_rainfall" placeholder="Enter amount" min="0" step="0.01"
                                        required>
                                </div>
                                <div class="col-md-12">
                                    <label for="juneSepRainfall" class="form-label"><i
                                            class="fas fa-cloud-rain me-2"></i>June-Sep Rainfall (mm)</label>
                                    <input type="number" class="form-control" id="juneSepRainfall"
                                        name="june_sep_rainfall" placeholder="Enter amount" min="0" step="0.01"
                                        required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-4">
                                <i class="fas fa-search-location me-2"></i>Analyze Risk
                            </button>
                        </form>

                        <!-- Loading Spinner -->
                        <div id="loadingSpinner" class="spinner-container text-center mt-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted">Analyzing data...</p>
                        </div>

                        <!-- Result Section -->
                        <div id="resultSection" class="mt-4">
                            <div id="resultCard" class="card p-4 text-center">
                                <div class="card-icon mb-3">
                                    <i id="resultIcon" class="fas fa-check-circle fa-3x"></i>
                                </div>
                                <h3 id="riskLevel" class="result-title"></h3>
                                <p id="confidence" class="result-confidence"></p>
                                <div id="resultAlert" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
